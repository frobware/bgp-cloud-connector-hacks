<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 1128" width="1570" height="1128" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .title { fill: #14161a; font-size: 22px; font-weight: 700; }
    .sub   { fill: #5b6470; font-size: 13px; }
    .glbl  { fill: #14161a; font-size: 13px; font-weight: 700; }
    .hd1   { fill: #14161a; font-size: 15px; font-weight: 700; }
    .hd2   { fill: #5b6470; font-size: 12px; }
    .rl    { fill: #14161a; font-size: 13px; font-weight: 600; }
    .t     { fill: #14161a; font-size: 12px; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .g-self    { fill: #eef4fb; stroke: #2f6fb0; stroke-width: 1.5; }
    .g-classic { fill: #f6f1fb; stroke: #8b6bb1; stroke-width: 1.5; }
    .g-hcp     { fill: #fdf6e6; stroke: #b8891f; stroke-width: 1.5; }
    .head  { fill: #f4f7fb; stroke: #98a6b8; stroke-width: 1.2; }
    .rlbox { fill: #fafbfc; stroke: #d5dbe3; stroke-width: 1; }
    .c-n   { fill: #ffffff; stroke: #d5dbe3; stroke-width: 1; }
    .c-ok  { fill: #eaf6ee; stroke: #2f8f5b; stroke-width: 1.5; }
    .c-amb { fill: #fdf6e6; stroke: #b8891f; stroke-width: 1.5; }
    .c-bad { fill: #fdf0ee; stroke: #b3341f; stroke-width: 1.5; }
    .c-sec { fill: #f2f3f5; stroke: #7a828c; stroke-width: 1.5; }
    .c-fed { fill: #eef4fb; stroke: #2f6fb0; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .title, .glbl, .hd1, .rl, .t { fill: #e6e9ee; }
      .sub, .hd2 { fill: #a3acb8; }
      .g-self    { fill: #172435; stroke: #5b93d1; }
      .g-classic { fill: #241c30; stroke: #a88cce; }
      .g-hcp     { fill: #2c2414; stroke: #d4a63c; }
      .head  { fill: #1d2129; stroke: #4a5361; }
      .rlbox { fill: #191c22; stroke: #343b46; }
      .c-n   { fill: #14161a; stroke: #343b46; }
      .c-ok  { fill: #142a1d; stroke: #3fae72; }
      .c-amb { fill: #2c2414; stroke: #d4a63c; }
      .c-bad { fill: #321a16; stroke: #e0634c; }
      .c-sec { fill: #1d2025; stroke: #8b939e; }
      .c-fed { fill: #172435; stroke: #5b93d1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1570" height="1128"/>
  <text class="title" x="20" y="44">How the operator meets Azure: five flavours, what ships in 1.1, and how each is tested</text>
  <text class="sub" x="20" y="66">bgp-cloud-connector, 2026-10-19. Columns are cluster flavours; rows say whether it ships in 1.1 and why, who builds it, which identity the operator acts as, and where it is tested.</text>
  <rect class="g-self" x="222" y="96" width="532" height="26" rx="5"/>
  <text class="glbl" x="488.0" y="114" text-anchor="middle">Self-managed Azure (you run openshift-install)</text>
  <rect class="g-classic" x="758" y="96" width="532" height="26" rx="5"/>
  <text class="glbl" x="1024.0" y="114" text-anchor="middle">ARO classic (Microsoft runs it, control plane on VMs)</text>
  <rect class="g-hcp" x="1294" y="96" width="264" height="26" rx="5"/>
  <text class="glbl" x="1426.0" y="114" text-anchor="middle">ARO HCP (hosted control planes)</text>
  <rect class="head" x="222" y="130" width="264" height="54" rx="5"/>
  <text class="hd1" x="234" y="153">Azure IPI</text>
  <text class="hd2" x="234" y="172">Passthrough (the default)</text>
  <rect class="head" x="490" y="130" width="264" height="54" rx="5"/>
  <text class="hd1" x="502" y="153">Azure IPI</text>
  <text class="hd2" x="502" y="172">Manual + Workload ID (ccoctl)</text>
  <rect class="head" x="758" y="130" width="264" height="54" rx="5"/>
  <text class="hd1" x="770" y="153">ARO classic</text>
  <text class="hd2" x="770" y="172">service principal</text>
  <rect class="head" x="1026" y="130" width="264" height="54" rx="5"/>
  <text class="hd1" x="1038" y="153">ARO classic</text>
  <text class="hd2" x="1038" y="172">MIWI (managed identities)</text>
  <rect class="head" x="1294" y="130" width="264" height="54" rx="5"/>
  <text class="hd1" x="1306" y="153">ARO HCP</text>
  <text class="hd2" x="1306" y="172">public service, int, or pers</text>
  <rect class="rlbox" x="20" y="190" width="196" height="48" rx="5"/>
  <text class="rl" x="30" y="212">Ships in 1.1?</text>
  <rect class="c-ok" x="222" y="190" width="264" height="48" rx="5"/>
  <text class="t" x="234" y="210">YES</text>
  <text class="t" x="234" y="226">works now</text>
  <rect class="c-amb" x="490" y="190" width="264" height="48" rx="5"/>
  <text class="t" x="502" y="210">YES, once a CI job tests it</text>
  <text class="t" x="502" y="226">expected to work, untested</text>
  <rect class="c-ok" x="758" y="190" width="264" height="48" rx="5"/>
  <text class="t" x="770" y="210">YES</text>
  <text class="t" x="770" y="226">works now; ARO has not yet confirmed</text>
  <rect class="c-bad" x="1026" y="190" width="264" height="48" rx="5"/>
  <text class="t" x="1038" y="210">NO</text>
  <text class="t" x="1038" y="226">works only with a borrowed identity</text>
  <rect class="c-amb" x="1294" y="190" width="264" height="48" rx="5"/>
  <text class="t" x="1306" y="210">WHEN ARO'S CHANGE IS AVAILABLE</text>
  <text class="t" x="1306" y="226">otherwise a later release</text>
  <rect class="rlbox" x="20" y="242" width="196" height="96" rx="5"/>
  <text class="rl" x="30" y="264">Why</text>
  <rect class="c-n" x="222" y="242" width="264" height="96" rx="5"/>
  <text class="t" x="234" y="262">no deny assignment: the operator</text>
  <text class="t" x="234" y="278">writes the NICs itself</text>
  <rect class="c-n" x="490" y="242" width="264" height="96" rx="5"/>
  <text class="t" x="502" y="262">no deny assignment: the operator</text>
  <text class="t" x="502" y="278">writes the NICs as its own identity</text>
  <rect class="c-n" x="758" y="242" width="264" height="96" rx="5"/>
  <text class="t" x="770" y="262">the deny assignment exempts the</text>
  <text class="t" x="770" y="278">cluster principal, which CCO</text>
  <text class="t" x="770" y="294">passthrough copies to the operator</text>
  <rect class="c-n" x="1026" y="242" width="264" height="96" rx="5"/>
  <text class="t" x="1038" y="262">only platform identities may write</text>
  <text class="t" x="1038" y="278">the NICs; borrowing one fails</text>
  <text class="t mono" x="1038" y="294">az aro update</text>
  <text class="t" x="1038" y="310">(ARO, 2026-10-16), and OCP's</text>
  <text class="t" x="1038" y="326">machine API cannot set forwarding</text>
  <rect class="c-n" x="1294" y="242" width="264" height="96" rx="5"/>
  <text class="t" x="1306" y="262">the deny assignment refuses the</text>
  <text class="t" x="1306" y="278">operator's NIC write in production;</text>
  <text class="t" x="1306" y="294">each way past it needs ARO</text>
  <text class="t" x="1306" y="310">(see the last row)</text>
  <rect class="rlbox" x="20" y="342" width="196" height="64" rx="5"/>
  <text class="rl" x="30" y="364">Who builds it</text>
  <rect class="c-n" x="222" y="342" width="264" height="64" rx="5"/>
  <text class="t mono" x="234" y="362">openshift-install</text>
  <rect class="c-n" x="490" y="342" width="264" height="64" rx="5"/>
  <text class="t mono" x="502" y="362">ccoctl azure create-all</text>
  <text class="t" x="502" y="378">makes an OIDC issuer and one identity</text>
  <text class="t" x="502" y="394">per component, then openshift-install</text>
  <rect class="c-n" x="758" y="342" width="264" height="64" rx="5"/>
  <text class="t mono" x="770" y="362">az aro create</text>
  <text class="t" x="770" y="378">with a cluster service principal</text>
  <rect class="c-n" x="1026" y="342" width="264" height="64" rx="5"/>
  <text class="t mono" x="1038" y="362">az aro create</text>
  <text class="t" x="1038" y="378">with platform workload identities:</text>
  <text class="t" x="1038" y="394">machine-api, cloud-network-config, ...</text>
  <rect class="c-n" x="1294" y="342" width="264" height="64" rx="5"/>
  <text class="t" x="1306" y="362">the ARO HCP service, through ARM:</text>
  <text class="t" x="1306" y="378">cluster, then node pool;</text>
  <text class="t" x="1306" y="394">thirteen managed identities</text>
  <rect class="rlbox" x="20" y="410" width="196" height="48" rx="5"/>
  <text class="rl" x="30" y="432">Kind of credential</text>
  <rect class="c-sec" x="222" y="410" width="264" height="48" rx="5"/>
  <text class="t" x="234" y="430">long-lived client secret,</text>
  <text class="t" x="234" y="446">copied by CCO</text>
  <rect class="c-fed" x="490" y="410" width="264" height="48" rx="5"/>
  <text class="t" x="502" y="430">federated token for a</text>
  <text class="t" x="502" y="446">managed identity (STS-like)</text>
  <rect class="c-sec" x="758" y="410" width="264" height="48" rx="5"/>
  <text class="t" x="770" y="430">long-lived client secret,</text>
  <text class="t" x="770" y="446">the cluster principal, copied by CCO</text>
  <rect class="c-fed" x="1026" y="410" width="264" height="48" rx="5"/>
  <text class="t" x="1038" y="430">federated token for a</text>
  <text class="t" x="1038" y="446">managed identity (STS-like)</text>
  <rect class="c-fed" x="1294" y="410" width="264" height="48" rx="5"/>
  <text class="t" x="1306" y="430">federated token for a</text>
  <text class="t" x="1306" y="446">managed identity (STS-like)</text>
  <rect class="rlbox" x="20" y="462" width="196" height="64" rx="5"/>
  <text class="rl" x="30" y="484">Deny assignment on the NICs</text>
  <rect class="c-ok" x="222" y="462" width="264" height="64" rx="5"/>
  <text class="t" x="234" y="482">none</text>
  <rect class="c-ok" x="490" y="462" width="264" height="64" rx="5"/>
  <text class="t" x="502" y="482">none</text>
  <rect class="c-amb" x="758" y="462" width="264" height="64" rx="5"/>
  <text class="t" x="770" y="482">yes: exempts the cluster principal</text>
  <text class="t" x="770" y="498">(which the operator carries)</text>
  <rect class="c-bad" x="1026" y="462" width="264" height="64" rx="5"/>
  <text class="t" x="1038" y="482">yes: exempts only the platform</text>
  <text class="t" x="1038" y="498">identities and the ARO RP</text>
  <rect class="c-bad" x="1294" y="462" width="264" height="64" rx="5"/>
  <text class="t" x="1306" y="482">production: about twenty, per action</text>
  <text class="t" x="1306" y="498">int (CI) and pers: none</text>
  <rect class="rlbox" x="20" y="530" width="196" height="80" rx="5"/>
  <text class="rl" x="30" y="552">Route Server calls as</text>
  <rect class="c-n" x="222" y="530" width="264" height="80" rx="5"/>
  <text class="t" x="234" y="550">the root service principal</text>
  <rect class="c-n" x="490" y="530" width="264" height="80" rx="5"/>
  <text class="t" x="502" y="550">the operator's own identity,</text>
  <text class="t" x="502" y="566">which you create</text>
  <rect class="c-n" x="758" y="530" width="264" height="80" rx="5"/>
  <text class="t" x="770" y="550">the cluster principal, plus</text>
  <text class="t" x="770" y="566">Network Contributor on your group</text>
  <text class="t" x="770" y="582">(release#87240 narrows it to</text>
  <text class="t" x="770" y="598">the Route Server)</text>
  <rect class="c-n" x="1026" y="530" width="264" height="80" rx="5"/>
  <text class="t" x="1038" y="550">the operator's own identity,</text>
  <text class="t" x="1038" y="566">Network Contributor on your group</text>
  <rect class="c-n" x="1294" y="530" width="264" height="80" rx="5"/>
  <text class="t" x="1306" y="550">the operator's own identity,</text>
  <text class="t" x="1306" y="566">Network Contributor on the</text>
  <text class="t" x="1306" y="582">customer group (release#87240</text>
  <text class="t" x="1306" y="598">narrows it to the Route Server)</text>
  <rect class="rlbox" x="20" y="614" width="196" height="80" rx="5"/>
  <text class="rl" x="30" y="636">NIC writes as</text>
  <rect class="c-n" x="222" y="614" width="264" height="80" rx="5"/>
  <text class="t" x="234" y="634">the root service principal</text>
  <rect class="c-n" x="490" y="614" width="264" height="80" rx="5"/>
  <text class="t" x="502" y="634">the operator's own identity</text>
  <rect class="c-n" x="758" y="614" width="264" height="80" rx="5"/>
  <text class="t" x="770" y="634">the cluster principal</text>
  <rect class="c-bad" x="1026" y="614" width="264" height="80" rx="5"/>
  <text class="t" x="1038" y="634">machine-api, BORROWED: named in</text>
  <text class="t mono" x="1038" y="650">networkInterfaceClientID</text>
  <text class="t" x="1038" y="666">plus a federated credential on it</text>
  <text class="t" x="1038" y="682">trusting our ServiceAccount</text>
  <rect class="c-amb" x="1294" y="614" width="264" height="80" rx="5"/>
  <text class="t" x="1306" y="634">the operator's own identity, with</text>
  <text class="t" x="1306" y="650">ARO Network Operator on the</text>
  <text class="t" x="1306" y="666">managed group (release#87151)</text>
  <text class="t" x="1306" y="682">refused in production</text>
  <rect class="rlbox" x="20" y="698" width="196" height="80" rx="5"/>
  <text class="rl" x="30" y="720">CI job (openshift/release)</text>
  <rect class="c-ok" x="222" y="698" width="264" height="80" rx="5"/>
  <text class="t mono" x="234" y="718">e2e-azure-operator</text>
  <text class="t" x="234" y="734">runs on every PR; required</text>
  <rect class="c-bad" x="490" y="698" width="264" height="80" rx="5"/>
  <text class="t" x="502" y="718">NONE</text>
  <text class="t" x="502" y="734">candidate chain:</text>
  <text class="t mono" x="502" y="750">ipi-azure-pre-manual-oidc-</text>
  <text class="t mono" x="502" y="766">workload-identity</text>
  <rect class="c-ok" x="758" y="698" width="264" height="80" rx="5"/>
  <text class="t mono" x="770" y="718">e2e-aro-classic-operator</text>
  <text class="t" x="770" y="734">runs on every PR; required</text>
  <rect class="c-amb" x="1026" y="698" width="264" height="80" rx="5"/>
  <text class="t mono" x="1038" y="718">e2e-aro-classic-miwi-operator</text>
  <text class="t" x="1038" y="734">runs on every PR; required</text>
  <text class="t" x="1038" y="750">(release#87202); passes only by</text>
  <text class="t" x="1038" y="766">borrowing machine-api</text>
  <rect class="c-amb" x="1294" y="698" width="264" height="80" rx="5"/>
  <text class="t mono" x="1306" y="718">e2e-aro-hcp-operator</text>
  <text class="t" x="1306" y="734">runs on every PR; required</text>
  <text class="t" x="1306" y="750">(release#87197); int has no deny</text>
  <text class="t" x="1306" y="766">assignments, so production differs</text>
  <rect class="rlbox" x="20" y="782" width="196" height="96" rx="5"/>
  <text class="rl" x="30" y="804">By hand (hacks repo)</text>
  <rect class="c-n" x="222" y="782" width="264" height="96" rx="5"/>
  <text class="t mono" x="234" y="802">azure-create-cluster</text>
  <rect class="c-n" x="490" y="782" width="264" height="96" rx="5"/>
  <text class="t mono" x="502" y="802">azure-create-cluster</text>
  <text class="t mono" x="502" y="818">AZURE_CREDENTIALS_MODE=Manual</text>
  <rect class="c-n" x="758" y="782" width="264" height="96" rx="5"/>
  <text class="t mono" x="770" y="802">aro-create-cluster</text>
  <text class="t mono" x="770" y="818">ARO_IDENTITY=service-principal</text>
  <rect class="c-n" x="1026" y="782" width="264" height="96" rx="5"/>
  <text class="t mono" x="1038" y="802">aro-create-cluster</text>
  <text class="t" x="1038" y="818">(managed is the default)</text>
  <rect class="c-n" x="1294" y="782" width="264" height="96" rx="5"/>
  <text class="t mono" x="1306" y="802">aro-hcp-create-cluster</text>
  <text class="t" x="1306" y="818">public service, QE subscription,</text>
  <text class="t" x="1306" y="834">uksouth, real deny assignments</text>
  <text class="t" x="1306" y="850">pers: personal DEV environment,</text>
  <text class="t" x="1306" y="866">own service, no deny assignments</text>
  <rect class="rlbox" x="20" y="882" width="196" height="112" rx="5"/>
  <text class="rl" x="30" y="904">What it still needs</text>
  <rect class="c-n" x="222" y="882" width="264" height="112" rx="5"/>
  <text class="t" x="234" y="902">-</text>
  <rect class="c-bad" x="490" y="882" width="264" height="112" rx="5"/>
  <text class="t" x="502" y="902">a CI job: the flavour</text>
  <text class="t" x="502" y="918">closest to ROSA STS</text>
  <rect class="c-amb" x="758" y="882" width="264" height="112" rx="5"/>
  <text class="t" x="770" y="902">ARO to confirm the configuration</text>
  <text class="t" x="770" y="918">is supported</text>
  <rect class="c-bad" x="1026" y="882" width="264" height="112" rx="5"/>
  <text class="t" x="1038" y="902">nothing we can do: ARO will not</text>
  <text class="t" x="1038" y="918">exempt nic/write, and OCP has no</text>
  <text class="t" x="1038" y="934">forwarding field to ask for</text>
  <rect class="c-bad" x="1294" y="882" width="264" height="112" rx="5"/>
  <text class="t" x="1306" y="902">one of, all from ARO:</text>
  <text class="t" x="1306" y="918">1.1: relax the deny assignment</text>
  <text class="t" x="1306" y="934">later: an install-time operator</text>
  <text class="t" x="1306" y="950">identity, or hypershift#9966</text>
  <text class="t" x="1306" y="966">(node pool forwarding) in the</text>
  <text class="t" x="1306" y="982">ARO HCP API</text>
  <rect class="c-ok" x="20" y="1016" width="18" height="14" rx="3"/>
  <text class="t" x="44" y="1028">covered, or nothing in the way</text>
  <rect class="c-amb" x="262.0" y="1016" width="18" height="14" rx="3"/>
  <text class="t" x="286.0" y="1028">partial: untested, unconfirmed, or proven only without production's deny assignments</text>
  <rect class="c-bad" x="849.6" y="1016" width="18" height="14" rx="3"/>
  <text class="t" x="873.6" y="1028">gap, borrowed identity, or blocked on ARO</text>
  <rect class="c-sec" x="1162.0" y="1016" width="18" height="14" rx="3"/>
  <text class="t" x="1186.0" y="1028">long-lived secret</text>
  <rect class="c-fed" x="1320.8" y="1016" width="18" height="14" rx="3"/>
  <text class="t" x="1344.8" y="1028">federated token (STS-like)</text>
  <text class="sub" x="20" y="1060">The MIWI job grants the cloud-network-config platform identity the built-in role Azure Red Hat OpenShift Network Operator (be7a6435-...) on the vnet: the role openshift/release#87151 gives the operator on ARO HCP's managed group.</text>
  <text class="sub" x="20" y="1080">Not ARO HCP: HyperShift on AKS (cluster_profile hypershift-aks) has no deny assignments, so nothing it shows transfers to the product.</text>
  <text class="sub" x="20" y="1100">"Runs on every PR" excludes PRs that change only docs and metadata (skip_if_only_changed). Not checked: that e2e-azure-operator's cluster runs CCO in passthrough; it is the documented Azure default.</text>
</svg>
